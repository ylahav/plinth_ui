name: plinth_template_account
description: >-
  Auth and account starter for Plinth UI — sign-in that fails the way
  real sign-in fails, then a signed-in shell with profile, security and
  team permissions. Copy the directory and run `flutter create .`.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  plinth_blocks:
    path: ../../packages/plinth_blocks

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
