<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Every Plinth UI component in every state, with knobs for size, variant, colour and theme. The isolated gallery — for seeing what one component does, rather than how a page is built.">

  <!-- Flutter web renders to canvas, so a crawler sees no text at all:
       these tags are the only thing it has to go on. Absolute URLs
       because a crawler does not resolve them against <base href>. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Plinth UI">
  <meta property="og:url" content="https://ylahav.github.io/plinth_ui/widgetbook/">
  <meta property="og:title" content="Plinth UI — component gallery">
  <meta property="og:description" content="Every Plinth UI component in every state, with knobs for size, variant, colour and theme. The isolated gallery — for seeing what one component does, rather than how a page is built.">
  <meta property="og:image" content="https://ylahav.github.io/plinth_ui/widgetbook/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Plinth UI — component gallery">
  <meta name="twitter:description" content="Every Plinth UI component in every state, with knobs for size, variant, colour and theme. The isolated gallery — for seeing what one component does, rather than how a page is built.">
  <meta name="twitter:image" content="https://ylahav.github.io/plinth_ui/widgetbook/icons/Icon-512.png">
  <link rel="canonical" href="https://ylahav.github.io/plinth_ui/widgetbook/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Plinth gallery">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Plinth UI — component gallery</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
