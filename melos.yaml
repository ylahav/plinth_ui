name: plinth_ui
repository: https://github.com/ylahav/plinth_ui

packages:
  - packages/**
  - example
  - widgetbook

command:
  bootstrap:
    runPubGetInParallel: true
  version:
    linkToCommits: true
    workspaceChangelog: true

scripts:
  analyze:
    run: melos exec -- "dart analyze ."
    description: Run dart analyze in all packages

  format:
    run: melos exec -- "dart format . --set-exit-if-changed"
    description: Check formatting in all packages (fails if anything needs reformatting — used by CI)

  format-fix:
    run: melos exec -- "dart format ."
    description: Apply formatting fixes in all packages (run this, then commit, if `format` fails)

  test:
    run: melos exec --dir-exists="test" -- "flutter test"
    description: Run tests in all packages that have a test/ directory

  update-goldens:
    run: melos exec --dir-exists="test" -- "flutter test --update-goldens"
    description: Regenerate golden reference images (run after an intentional visual change)
