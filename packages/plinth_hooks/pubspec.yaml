name: plinth_hooks
description: Reusable stateful controllers for Plinth UI (equivalent to Mantine's @mantine/hooks).
version: 0.0.1
# Deliberately kept as a publish safety guard — remove this line only
# when actually ready to run `dart pub publish` for real.
publish_to: none
homepage: https://github.com/ylahav/plinth_ui
repository: https://github.com/ylahav/plinth_ui
issue_tracker: https://github.com/ylahav/plinth_ui/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
