version: 0.1.0
# Deliberately kept as a publish safety guard — remove this line only
# when actually ready to run `dart pub publish` for real.
publish_to: none
homepage: https://github.com/ylahav/plinth_ui
repository: https://github.com/ylahav/plinth_ui
