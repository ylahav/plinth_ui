name: plinth_core
description: >-
  Design tokens for Plinth UI: seed a 10-shade colour ramp from any
  brand colour, name colours by role, resolve text against WCAG
  contrast floors.
version: 1.0.1
homepage: https://github.com/ylahav/plinth_ui
repository: https://github.com/ylahav/plinth_ui
issue_tracker: https://github.com/ylahav/plinth_ui/issues

# Max five, lowercase, hyphens allowed. These are what someone
# browsing pub.dev by subject would actually search — a mix of the
# obvious ones that carry traffic and the narrow one that says what is
# different here.
topics:
  - design-tokens
  - theming
  - design-system
  - accessibility
  - color

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
