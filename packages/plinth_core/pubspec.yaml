name: plinth_core
description: >-
  Design tokens and theme foundation for Plinth UI: seed a 10-shade
  colour ramp from any brand colour, name colours by role, and resolve
  text against WCAG contrast floors. Spacing, radius and type scales.
version: 1.0.0
homepage: https://github.com/ylahav/plinth_ui
repository: https://github.com/ylahav/plinth_ui
issue_tracker: https://github.com/ylahav/plinth_ui/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
