name: plinth_components
description: Themeable, accessible Flutter widgets for Plinth UI.
version: 0.8.0
homepage: https://github.com/ylahav/plinth_ui
repository: https://github.com/ylahav/plinth_ui
issue_tracker: https://github.com/ylahav/plinth_ui/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Switched from path: deps to real published versions now that
  # both are live on pub.dev.
  plinth_core: ^0.2.0
  plinth_hooks: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
