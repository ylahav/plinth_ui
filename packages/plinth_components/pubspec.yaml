name: plinth_components
description: Themeable, accessible Flutter widgets for Plinth UI.
version: 0.0.1
# Deliberately kept as a publish safety guard — remove this line only
# when actually ready to run `dart pub publish` for real.
publish_to: none
homepage: https://github.com/ylahav/plinth_ui
repository: https://github.com/ylahav/plinth_ui
issue_tracker: https://github.com/ylahav/plinth_ui/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # These `path:` dependencies work fine for local development but
  # are NOT valid for a published package — pub.dev doesn't resolve
  # local paths. plinth_core and plinth_hooks need to be published
  # first, then these two lines switch to real version constraints,
  # e.g. `plinth_core: ^0.0.1`, before this package itself can be
  # published.
  plinth_core:
    path: ../plinth_core
  plinth_hooks:
    path: ../plinth_hooks

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
