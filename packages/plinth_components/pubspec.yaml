name: plinth_components
description: >-
  A Mantine-inspired component library for Flutter: 111 themeable,
  accessible widgets on a shared design-token foundation, with light
  and dark themes and WCAG-checked colour.
version: 0.17.0
# The live demo rather than the source: `repository` already covers
# the code, and someone reading the listing wants to try it.
homepage: https://ylahav.github.io/plinth_ui/
repository: https://github.com/ylahav/plinth_ui
issue_tracker: https://github.com/ylahav/plinth_ui/issues

# Max five, lowercase, hyphens allowed. These are what someone
# browsing pub.dev by subject would actually search.
topics:
  - ui
  - widgets
  - design-system
  - components
  - theming

# Rendered by example/tool/generate_screenshots.dart rather than
# captured by hand, so they can be regenerated when the theme changes.
screenshots:
  - description: >-
      A sign-up form built from PlinthTitle, PlinthTextInput with an
      error state, badges, a pill and a full-width button.
    path: screenshots/components.png
  - description: >-
      The same components in dark mode, which is a value swap rather
      than a second theme to maintain.
    path: screenshots/dark-mode.png
  - description: >-
      PlinthTable with sortable headers, striped rows and widget cells
      holding status badges.
    path: screenshots/data-display.png
  - description: >-
      Six of the thirteen generated colour ramps, ten shades each,
      contrast-checked against WCAG AA.
    path: screenshots/theming.png

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Switched from path: deps to real published versions now that
  # both are live on pub.dev.
  plinth_core: ^0.2.0
  # Not ^0.0.1: for pre-1.0 versions caret means >=0.0.1 <0.0.2, which
  # would exclude every future 0.0.x of a package whose API is stable.
  plinth_hooks: '>=0.0.1 <0.1.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
