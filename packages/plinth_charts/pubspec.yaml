name: plinth_charts
description: >-
  Charts for Plinth UI — themed from the same tokens, with a categorical
  palette validated against colour vision deficiency.
# Unreleased, and outside the lockstep for the same reason
# plinth_blocks is: a chart catalogue will churn while a token engine
# does not. See docs/PUBLISHING.md.
version: 0.1.0
homepage: https://github.com/ylahav/plinth_ui
repository: https://github.com/ylahav/plinth_ui
issue_tracker: https://github.com/ylahav/plinth_ui/issues

topics:
  - charts
  - data-visualization
  - ui
  - theming
  - accessibility

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Charts read the theme's series palette and contrast machinery; they
  # do not need the widget library.
  plinth_core: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
