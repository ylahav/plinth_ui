name: plinth_blocks
description: >-
  Composed, themeable sections for Plinth UI — sign-in cards, headers,
  stat tiles and the rest — assembled from plinth_components.
# Unreleased, and deliberately not 1.2.0.
#
# The other three packages move in lockstep from 1.0.0 (see
# docs/PUBLISHING.md). Whether a fourth joins that lockstep, or carries
# its own version because its surface will churn while the token engine
# does not, is a decision to take at the first release rather than one
# to inherit from a number picked here.
version: 0.2.1
homepage: https://github.com/ylahav/plinth_ui
repository: https://github.com/ylahav/plinth_ui
issue_tracker: https://github.com/ylahav/plinth_ui/issues

# Max five.
topics:
  - ui
  - widgets
  - design-system
  - theming
  - accessibility

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Blocks are arrangements of components, so this is the whole
  # dependency. It brings plinth_core with it.
  plinth_components: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
